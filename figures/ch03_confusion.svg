<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ch03_confusion-t ch03_confusion-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch03_confusion-t">혼동행렬과 평가지표</title><desc id="ch03_confusion-d">실제 0·1과 예측 0·1의 네 칸 TN 21, FP 7, FN 3, TP 30와 정확도 0.8361, 정밀도 0.8108, 재현율 0.9091, F1 0.8571</desc><defs><marker id="ah-ch03_confusion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/><text x="380" y="26" font-size="15" font-weight="600" fill="#15171C" text-anchor="middle">혼동행렬 — 실습 3-2 심장질환 테스트 데이터 61명 (임계값 0.5)</text><text x="246" y="52" font-size="13" font-weight="700" fill="#15171C" text-anchor="middle">예측</text><text x="198.0" y="68" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">0 (없음)</text><text x="294.0" y="68" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">1 (있음)</text><text x="80" y="166" font-size="13" font-weight="700" fill="#15171C" text-anchor="middle" transform="rotate(-90 80 166)">실제</text><text x="140" y="122.0" font-size="12" font-weight="500" fill="#15171C" text-anchor="end">0 (없음)</text><text x="140" y="218.0" font-size="12" font-weight="500" fill="#15171C" text-anchor="end">1 (있음)</text><rect x="150" y="78" width="96" height="96" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.6"/><text x="198.0" y="114" font-size="14" font-weight="700" fill="#1F7A8C" text-anchor="middle">TN</text><text x="198.0" y="144" font-size="22" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">21</text><rect x="246" y="78" width="96" height="96" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.6"/><text x="294.0" y="114" font-size="14" font-weight="700" fill="#B3261E" text-anchor="middle">FP</text><text x="294.0" y="144" font-size="22" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">7</text><rect x="150" y="174" width="96" height="96" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.6"/><text x="198.0" y="210" font-size="14" font-weight="700" fill="#B3261E" text-anchor="middle">FN</text><text x="198.0" y="240" font-size="22" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">3</text><rect x="246" y="174" width="96" height="96" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.6"/><text x="294.0" y="210" font-size="14" font-weight="700" fill="#1F7A8C" text-anchor="middle">TP</text><text x="294.0" y="240" font-size="22" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">30</text><text x="420" y="92" font-size="13.5" font-weight="700" fill="#4635B1" text-anchor="start">Accuracy</text><text x="520" y="92" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start" font-family="IBM Plex Mono, Consolas, monospace">(TP + TN) / 전체</text><text x="420" y="111" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="start" font-family="IBM Plex Mono, Consolas, monospace">51/61 = 0.8361</text><text x="560" y="111" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="start">전체 중 맞힌 비율</text><text x="420" y="138" font-size="13.5" font-weight="700" fill="#4635B1" text-anchor="start">Precision</text><text x="520" y="138" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start" font-family="IBM Plex Mono, Consolas, monospace">TP / (TP + FP)</text><text x="420" y="157" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="start" font-family="IBM Plex Mono, Consolas, monospace">30/37 = 0.8108</text><text x="560" y="157" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="start">&quot;있음&quot;이라 한 것 중 진짜</text><text x="420" y="184" font-size="13.5" font-weight="700" fill="#4635B1" text-anchor="start">Recall</text><text x="520" y="184" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start" font-family="IBM Plex Mono, Consolas, monospace">TP / (TP + FN)</text><text x="420" y="203" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="start" font-family="IBM Plex Mono, Consolas, monospace">30/33 = 0.9091</text><text x="560" y="203" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="start">진짜 환자 중 찾아낸 비율</text><text x="420" y="230" font-size="13.5" font-weight="700" fill="#4635B1" text-anchor="start">F1</text><text x="520" y="230" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start" font-family="IBM Plex Mono, Consolas, monospace">2PR / (P + R)</text><text x="420" y="249" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="start" font-family="IBM Plex Mono, Consolas, monospace">0.8571</text><text x="560" y="249" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="start">Precision과 Recall의 조화평균</text><text x="380" y="286" font-size="12.5" font-weight="500" fill="#B3261E" text-anchor="middle">대각선(TN, TP)은 맞힌 수, 대각선 밖(FP, FN)은 틀린 수. 의료 선별에서는 환자를 놓치는 FN이 특히 비싸다</text></svg>