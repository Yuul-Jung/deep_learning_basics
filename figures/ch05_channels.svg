<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="ch05_channels-t ch05_channels-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch05_channels-t">여러 입력 채널의 합성곱</title><desc id="ch05_channels-d">입력 채널 두 개에 필터의 판 두 개를 각각 합성곱한 뒤 더해 출력 채널 하나를 만드는 과정</desc><defs><marker id="ah-ch05_channels" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="260" fill="#FFFFFF"/><text x="380" y="26" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle">입력 채널이 여러 개일 때 — 필터 하나는 채널 수만큼의 3×3 판을 가지고, 결과를 더해 특징맵 하나를 만든다</text><rect x="30" y="56" width="110" height="56" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.5"/><text x="85" y="89" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">입력 채널 1</text><text x="160" y="90" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">∗</text><rect x="180" y="64" width="80" height="40" rx="8" fill="#FFD24A" stroke="#15171C" stroke-width="1.5"/><text x="220" y="89" font-size="11.5" font-weight="600" fill="#15171C" text-anchor="middle">필터1-판1</text><line x1="262" y1="84" x2="300" y2="84" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_channels)"/><rect x="302" y="64" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1.5"/><text x="347" y="89" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle">임시 맵 1</text><rect x="30" y="130" width="110" height="56" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.5"/><text x="85" y="163" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">입력 채널 2</text><text x="160" y="164" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">∗</text><rect x="180" y="138" width="80" height="40" rx="8" fill="#BBDEFB" stroke="#15171C" stroke-width="1.5"/><text x="220" y="163" font-size="11.5" font-weight="600" fill="#15171C" text-anchor="middle">필터1-판2</text><line x1="262" y1="158" x2="300" y2="158" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_channels)"/><rect x="302" y="138" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1.5"/><text x="347" y="163" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle">임시 맵 2</text><text x="347" y="125" font-size="20" font-weight="700" fill="#B3261E" text-anchor="middle">+</text><line x1="394" y1="120" x2="450" y2="120" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_channels)"/><rect x="452" y="94" width="120" height="52" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.8"/><text x="512" y="118" font-size="13" font-weight="700" fill="#1F7A8C" text-anchor="middle">출력 채널 1</text><text x="512" y="136" font-size="11" font-weight="400" fill="#15171C" text-anchor="middle">(+ 바이어스)</text><text x="660" y="92" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">필터 모양</text><text x="660" y="114" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[출력 채널, 입력 채널,</text><text x="660" y="132" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace"> 높이, 너비]</text><text x="660" y="158" font-size="11.5" font-weight="600" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">Conv2: [16, 8, 3, 3]</text><text x="380" y="222" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">필터를 16개 두면 이 계산을 16번 해서 출력 채널(특징맵) 16개가 나온다 — 출력 채널 수 = 필터 수</text><text x="380" y="246" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">컬러 이미지(채널 3)든 앞 층의 특징맵 8장이든 계산 방법은 같다 (추가 확인 05)</text></svg>