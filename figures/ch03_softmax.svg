<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ch03_softmax-t ch03_softmax-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch03_softmax-t">소프트맥스와 교차엔트로피</title><desc id="ch03_softmax-d">로짓 2.0, 1.0, 0.1을 지수화해 합으로 나누면 확률 0.6590, 0.2424, 0.0986. 정답이 A이면 교차엔트로피는 0.4170</desc><defs><marker id="ah-ch03_softmax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/><text x="380" y="26" font-size="15" font-weight="600" fill="#15171C" text-anchor="middle">소프트맥스 → 원핫 정답과 비교 → 교차엔트로피 (강의 예 [2.0, 1.0, 0.1])</text><text x="95" y="62" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">로짓 Z</text><rect x="40" y="74" width="110" height="34" rx="4" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="95" y="96" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">A  2.0</text><rect x="40" y="114" width="110" height="34" rx="4" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="95" y="136" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">B  1.0</text><rect x="40" y="154" width="110" height="34" rx="4" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="95" y="176" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">C  0.1</text><line x1="152" y1="131" x2="188" y2="131" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_softmax)"/><text x="245" y="62" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">e^z</text><rect x="190" y="74" width="110" height="34" rx="4" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="245" y="96" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">7.389</text><rect x="190" y="114" width="110" height="34" rx="4" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="245" y="136" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">2.718</text><rect x="190" y="154" width="110" height="34" rx="4" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="245" y="176" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">1.105</text><line x1="302" y1="131" x2="338" y2="131" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_softmax)"/><text x="395" y="62" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">확률 S = e^z / Σ</text><rect x="340" y="74" width="110" height="34" rx="4" fill="#E3F1F3" stroke="#9AA0A8" stroke-width="1"/><text x="395" y="96" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">0.6590</text><rect x="340" y="114" width="110" height="34" rx="4" fill="#E3F1F3" stroke="#9AA0A8" stroke-width="1"/><text x="395" y="136" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">0.2424</text><rect x="340" y="154" width="110" height="34" rx="4" fill="#E3F1F3" stroke="#9AA0A8" stroke-width="1"/><text x="395" y="176" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">0.0986</text><text x="615" y="62" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">정답 L (원핫)</text><rect x="560" y="74" width="110" height="34" rx="4" fill="#EDEAFA" stroke="#9AA0A8" stroke-width="1"/><text x="615" y="96" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">1</text><rect x="560" y="114" width="110" height="34" rx="4" fill="#EDEAFA" stroke="#9AA0A8" stroke-width="1"/><text x="615" y="136" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">0</text><rect x="560" y="154" width="110" height="34" rx="4" fill="#EDEAFA" stroke="#9AA0A8" stroke-width="1"/><text x="615" y="176" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">0</text><text x="245" y="210" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">Σ = 11.213</text><text x="395" y="210" font-size="12.5" font-weight="600" fill="#1F7A8C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">합 = 1.0000</text><path d="M 452 91 C 500 70, 520 70, 558 91" fill="none" stroke="#B3261E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-ch03_softmax)" marker-start="url(#ah-ch03_softmax)"/><text x="380" y="244" font-size="14" font-weight="700" fill="#B3261E" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">D(S, L) = −Σ Lᵢ log Sᵢ = −(1·log 0.6590 + 0 + 0) = 0.4170</text><text x="380" y="270" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">원핫 정답이 1인 칸 하나만 남는다 → 정답 클래스 확률의 −log</text><text x="380" y="290" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">강의 슬라이드는 확률을 0.7 · 0.2 · 0.1로 반올림해 −log 0.7 ≈ 0.357로 계산한다</text></svg>