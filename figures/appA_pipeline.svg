<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="appA_pipeline-t appA_pipeline-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="appA_pipeline-t">학습 설정 의사결정 파이프라인</title><desc id="appA_pipeline-d">문제 정의, Target 형태, 출력층, Loss, Optimizer, LR·Batch·Epoch, Validation, Metric 순서와 Target에 따른 세 가지 경로</desc><defs><marker id="ah-appA_pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="230" fill="#FFFFFF"/><text x="380" y="26" font-size="14.5" font-weight="600" fill="#15171C" text-anchor="middle">학습 설정은 앞 단계가 뒤 단계를 정한다 — 모델 이름보다 정답 y의 모양이 먼저</text><rect x="12" y="52" width="84" height="46" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.4"/><text x="54.0" y="80" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">문제 정의</text><line x1="96" y1="75" x2="103" y2="75" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-appA_pipeline)"/><rect x="103" y="52" width="84" height="46" rx="8" fill="#FFE7A3" stroke="#B3261E" stroke-width="2"/><text x="145.0" y="80" font-size="12.5" font-weight="700" fill="#B3261E" text-anchor="middle">Target 형태</text><line x1="187" y1="75" x2="194" y2="75" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-appA_pipeline)"/><rect x="194" y="52" width="84" height="46" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.4"/><text x="236.0" y="80" font-size="12.5" font-weight="700" fill="#4635B1" text-anchor="middle">출력층</text><line x1="278" y1="75" x2="285" y2="75" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-appA_pipeline)"/><rect x="285" y="52" width="84" height="46" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.4"/><text x="327.0" y="80" font-size="12.5" font-weight="700" fill="#4635B1" text-anchor="middle">Loss</text><line x1="369" y1="75" x2="376" y2="75" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-appA_pipeline)"/><rect x="376" y="52" width="84" height="46" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.4"/><text x="418.0" y="80" font-size="12.5" font-weight="700" fill="#1F7A8C" text-anchor="middle">Optimizer</text><line x1="460" y1="75" x2="467" y2="75" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-appA_pipeline)"/><rect x="467" y="52" width="84" height="46" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.4"/><text x="509.0" y="72" font-size="11.5" font-weight="700" fill="#1F7A8C" text-anchor="middle">LR · Batch</text><text x="509.0" y="89" font-size="11.5" font-weight="700" fill="#1F7A8C" text-anchor="middle">· Epoch</text><line x1="551" y1="75" x2="558" y2="75" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-appA_pipeline)"/><rect x="558" y="52" width="84" height="46" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><text x="600.0" y="80" font-size="12.5" font-weight="700" fill="#2E7D32" text-anchor="middle">Validation</text><line x1="642" y1="75" x2="649" y2="75" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-appA_pipeline)"/><rect x="649" y="52" width="84" height="46" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><text x="691.0" y="80" font-size="12.5" font-weight="700" fill="#2E7D32" text-anchor="middle">Metric</text><path d="M 103 108 L 103 116 L 369 116 L 369 108" fill="none" stroke="#B3261E" stroke-width="1.4"/><text x="236.0" y="134" font-size="11.5" font-weight="600" fill="#B3261E" text-anchor="middle">정답 y의 모양이 정한다</text><path d="M 376 108 L 376 116 L 551 116 L 551 108" fill="none" stroke="#1F7A8C" stroke-width="1.4"/><text x="463.5" y="134" font-size="11.5" font-weight="600" fill="#1F7A8C" text-anchor="middle">학습 방법 — 손실 곡선을 보며 조정</text><path d="M 558 108 L 558 116 L 733 116 L 733 108" fill="none" stroke="#2E7D32" stroke-width="1.4"/><text x="645.5" y="134" font-size="11.5" font-weight="600" fill="#2E7D32" text-anchor="middle">평가 — Loss와 따로 본다</text><text x="380" y="166" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">y가 실수 → 회귀 → 출력 1개 → MSELoss / L1Loss</text><text x="380" y="188" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">y가 0/1 → 이진분류 → 로짓 1개 → BCEWithLogitsLoss</text><text x="380" y="210" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">y가 클래스 번호 → 다중분류 → 로짓 C개 → CrossEntropyLoss</text></svg>