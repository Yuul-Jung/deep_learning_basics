<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ch02_matrix-t ch02_matrix-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch02_matrix-t">행렬로 쓴 가설</title><desc id="ch02_matrix-d">[5,3] 입력 행렬과 [3,1] 가중치의 행렬곱이 학생 다섯 명의 예측 [5,1]을 한 번에 계산한다. [n,3]에 [3,2]를 곱하면 [n,2]</desc><defs><marker id="ah-ch02_matrix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">H(X) = XW — 학생 5명을 행렬곱 한 번으로</text><text x="100" y="58" font-size="13" font-weight="700" fill="#1F7A8C" text-anchor="middle">X  [5, 3]</text><rect x="40" y="68" width="40" height="40" fill="#FFD24A" stroke="#1F7A8C" stroke-width="1.2"/><text x="60.0" y="93.0" font-size="13" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">73</text><rect x="80" y="68" width="40" height="40" fill="#FFD24A" stroke="#1F7A8C" stroke-width="1.2"/><text x="100.0" y="93.0" font-size="13" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">80</text><rect x="120" y="68" width="40" height="40" fill="#FFD24A" stroke="#1F7A8C" stroke-width="1.2"/><text x="140.0" y="93.0" font-size="13" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">75</text><rect x="40" y="108" width="40" height="40" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.2"/><text x="60.0" y="133.0" font-size="13" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">93</text><rect x="80" y="108" width="40" height="40" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.2"/><text x="100.0" y="133.0" font-size="13" font-weight="4