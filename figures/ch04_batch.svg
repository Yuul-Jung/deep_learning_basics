<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="ch04_batch-t ch04_batch-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch04_batch-t">Batch, Iteration, Epoch</title><desc id="ch04_batch-d">5만 5천 개를 64개씩 나누면 Epoch당 860번 갱신하고 마지막 배치는 24장이다. 5 Epoch면 4300번 갱신한다</desc><defs><marker id="ah-ch04_batch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="270" fill="#FFFFFF"/><text x="380" y="26" font-size="14" font-weight="600" fill="#15171C" text-anchor="middle">학습 데이터 55,000개를 배치 64개씩 — 한 Epoch에 Iteration 860번, 5 Epoch면 가중치 갱신 4,300번</text><rect x="30.0" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="59.2" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="88.3" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="117.5" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="146.7" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="175.8" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="205.0" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="234.2" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="263.3" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="292.5" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="321.7" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="350.8" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="380.0" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="409.2" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="438.3" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="467.5" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="496.7" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="525.8" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="555.0" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="584.2" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="613.3" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="642.5" y="56" width="29.2" height="40" fill="#FFFFFF" stroke="#9AA0A8"/><rect x="671.7" y="56" width="29.2" height="40" fill="#EDEAFA" stroke="#9AA0A8"/><rect x="700.8" y="56" width="29.2" height="40" fill="#FFF6D6" stroke="#9AA0A8"/><text x="44.583333333333336" y="81" font-size="10" font-weight="600" fill="#4635B1" text-anchor="middle">#1</text><text x="73.75" y="81" font-size="10" font-weight="600" fill="#4635B1" text-anchor="middle">#2</text><text x="380.0" y="81" font-size="14" font-weight="700" fill="#4A4F5A" text-anchor="middle">· · ·</text><text x="715.4166666666666" y="81" font-size="10" font-weight="600" fill="#C77700" text-anchor="middle">#860</text><text x="380.0" y="118" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="middle">1 Epoch = 배치 860개 (꽉 찬 배치 859개 × 64장 + 마지막 배치 24장)</text><rect x="30" y="150" width="110" height="28" rx="4" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="85" y="169" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">Batch</text><text x="156" y="169" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start">한 번에 모델에 넣는 묶음 (64장)</text><text x="730" y="169" font-size="12" font-weight="600" fill="#1F7A8C" text-anchor="end">[64, 1, 28, 28] 이미지 + [64] 정답</text><rect x="30" y="186" width="110" height="28" rx="4" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="85" y="205" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">Iteration</text><text x="156" y="205" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start">배치 하나로 순전파 → 손실 → 역전파 → 갱신 한 번</text><text x="730" y="205" font-size="12" font-weight="600" fill="#1F7A8C" text-anchor="end">Epoch당 860번</text><rect x="30" y="222" width="110" height="28" rx="4" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="85" y="241" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">Epoch</text><text x="156" y="241" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start">학습 데이터 전체를 한 번 다 보는 것</text><text x="730" y="241" font-size="12" font-weight="600" fill="#1F7A8C" text-anchor="end">5번 반복 → 갱신 4,300번</text></svg>