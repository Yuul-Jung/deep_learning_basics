<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ch05_arch-t ch05_arch-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch05_arch-t">CNN의 계층별 모양과 파라미터</title><desc id="ch05_arch-d">입력 [N,1,28,28]에서 Conv1, Pool, Conv2, Pool을 거쳐 [N,16,7,7], Flatten 784, Linear 10. 파라미터 9,098개</desc><defs><marker id="ah-ch05_arch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/><text x="380" y="26" font-size="14.5" font-weight="600" fill="#15171C" text-anchor="middle">실습 5-1의 CNN — 채널은 늘고(1 → 8 → 16) 가로·세로는 줄어든다(28 → 14 → 7)</text><rect x="23.0" y="103.0" width="58.0" height="58.0" fill="#F5F5F2" stroke="#15171C" stroke-width="1.2"/><text x="62.0" y="186" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">입력</text><text x="62.0" y="204" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 1, 28, 28]</text><line x1="108" y1="122" x2="124" y2="122" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_arch)"/><rect x="131.0" y="103.0" width="58.0" height="58.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="135.0" y="99.0" width="58.0" height="58.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="139.0" y="95.0" width="58.0" height="58.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="143.0" y="91.0" width="58.0" height="58.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="147.0" y="87.0" width="58.0" height="58.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="151.0" y="83.0" width="58.0" height="58.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><text x="170.0" y="186" font-size="12" font-weight="700" fill="#4635B1" text-anchor="middle">Conv1 + ReLU</text><text x="170.0" y="204" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 8, 28, 28]</text><text x="170.0" y="224" font-size="11" font-weight="600" fill="#4635B1" text-anchor="middle">80개</text><line x1="216" y1="122" x2="232" y2="122" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_arch)"/><rect x="249.0" y="113.0" width="38.0" height="38.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="253.0" y="109.0" width="38.0" height="38.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="257.0" y="105.0" width="38.0" height="38.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="261.0" y="101.0" width="38.0" height="38.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="265.0" y="97.0" width="38.0" height="38.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="269.0" y="93.0" width="38.0" height="38.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><text x="278.0" y="186" font-size="12" font-weight="700" fill="#C77700" text-anchor="middle">MaxPool</text><text x="278.0" y="204" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 8, 14, 14]</text><text x="278.0" y="224" font-size="11" font-weight="400" fill="#4A4F5A" text-anchor="middle">파라미터 없음</text><line x1="324" y1="122" x2="340" y2="122" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_arch)"/><rect x="357.0" y="113.0" width="38.0" height="38.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="361.0" y="109.0" width="38.0" height="38.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="365.0" y="105.0" width="38.0" height="38.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="369.0" y="101.0" width="38.0" height="38.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="373.0" y="97.0" width="38.0" height="38.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><rect x="377.0" y="93.0" width="38.0" height="38.0" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.2"/><text x="386.0" y="186" font-size="12" font-weight="700" fill="#4635B1" text-anchor="middle">Conv2 + ReLU</text><text x="386.0" y="204" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 16, 14, 14]</text><text x="386.0" y="224" font-size="11" font-weight="600" fill="#4635B1" text-anchor="middle">1,168개</text><line x1="432" y1="122" x2="448" y2="122" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_arch)"/><rect x="470.0" y="118.0" width="28.0" height="28.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="474.0" y="114.0" width="28.0" height="28.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="478.0" y="110.0" width="28.0" height="28.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="482.0" y="106.0" width="28.0" height="28.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="486.0" y="102.0" width="28.0" height="28.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><rect x="490.0" y="98.0" width="28.0" height="28.0" fill="#FFF6D6" stroke="#C77700" stroke-width="1.2"/><text x="494.0" y="186" font-size="12" font-weight="700" fill="#C77700" text-anchor="middle">MaxPool</text><text x="494.0" y="204" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 16, 7, 7]</text><text x="494.0" y="224" font-size="11" font-weight="400" fill="#4A4F5A" text-anchor="middle">파라미터 없음</text><line x1="540" y1="122" x2="556" y2="122" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_arch)"/><rect x="596.0" y="87.0" width="12" height="70" fill="#F5F5F2" stroke="#15171C" stroke-width="1.2"/><text x="602.0" y="186" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">Flatten</text><text x="602.0" y="204" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 784]</text><text x="602.0" y="224" font-size="11" font-weight="400" fill="#4A4F5A" text-anchor="middle">파라미터 없음</text><line x1="648" y1="122" x2="664" y2="122" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_arch)"/><rect x="704.0" y="107.0" width="12" height="30" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.2"/><text x="710.0" y="186" font-size="12" font-weight="700" fill="#1F7A8C" text-anchor="middle">Linear</text><text x="710.0" y="204" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 10]</text><text x="710.0" y="224" font-size="11" font-weight="600" fill="#4635B1" text-anchor="middle">7,850개</text><text x="380" y="256" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">학습 파라미터 = 80 + 1,168 + 7,850 = 9,098개  (실습 4-5 MLP 235,146개의 약 1/26)</text><text x="380" y="280" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">Conv 파라미터 = 출력 채널 × 입력 채널 × 3 × 3 + 출력 채널(바이어스) — 이미지 크기와 상관없다</text></svg>