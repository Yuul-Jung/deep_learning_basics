<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="ch05_overview-t ch05_overview-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch05_overview-t">5장 큰 그림</title><desc id="ch05_overview-d">MLP와 CNN의 구조 차이와 강의 슬라이드 세 묶음이 실습 5-1, 5-2와 어떻게 대응하는지 보여 준다</desc><defs><marker id="ah-ch05_overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">5장의 흐름 — Flatten 앞에 &quot;특징을 뽑는 부분&quot;을 붙인다</text><rect x="30" y="50" width="700" height="54" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.8"/><text x="110" y="83" font-size="15" font-weight="700" fill="#15171C" text-anchor="middle">4장 MLP</text><text x="420" y="74" font-size="13" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">Flatten → Linear</text><text x="420" y="94" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">픽셀 784개를 바로 계산</text><rect x="30" y="116" width="700" height="54" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.8"/><text x="110" y="149" font-size="15" font-weight="700" fill="#1F7A8C" text-anchor="middle">5장 CNN</text><text x="420" y="140" font-size="13" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">Conv → ReLU → Pool (×2) → Flatten → Linear</text><text x="420" y="160" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">3×3 필터로 지역 특징을 먼저 추출</text><text x="380" y="202" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle">강의 슬라이드와 실습의 대응 (강의 1–25 → 실습 5-1 → 5-2 순서로 진행)</text><rect x="14" y="218" width="390" height="28" rx="5" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="209" y="237" font-size="12" font-weight="600" fill="#4635B1" text-anchor="middle">강의 1–15 합성곱·풀링·패딩·특징 추출</text><line x1="406" y1="232" x2="430" y2="232" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_overview)"/><rect x="434" y="218" width="312" height="28" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="590" y="237" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">추가 확인: 슬라이드 숫자 예제 재현</text><rect x="14" y="254" width="390" height="28" rx="5" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="209" y="273" font-size="12" font-weight="600" fill="#4635B1" text-anchor="middle">강의 16–25 Fashion-MNIST·채널·CNN API·크기 계산</text><line x1="406" y1="268" x2="430" y2="268" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_overview)"/><rect x="434" y="254" width="312" height="28" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="590" y="273" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">실습 5-1 CNN 학습·평가·2픽셀 이동</text><rect x="14" y="290" width="390" height="28" rx="5" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="209" y="309" font-size="12" font-weight="600" fill="#4635B1" text-anchor="middle">강의 11–15 특징 추출 결과 해석</text><line x1="406" y1="304" x2="430" y2="304" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_overview)"/><rect x="434" y="290" width="312" height="28" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="590" y="309" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">실습 5-2 학습된 필터와 특징맵 보기</text></svg>