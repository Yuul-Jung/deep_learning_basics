<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-labelledby="ch01_broadcast-t ch01_broadcast-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch01_broadcast-t">브로드캐스팅</title><desc id="ch01_broadcast-d">온도 [22.5, 31, 36] 에 1.5 를 더하면 1.5 가 세 칸으로 늘어난 것처럼 계산되어 [24, 32.5, 37.5] 가 된다</desc><defs><marker id="ah-ch01_broadcast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="190" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">브로드캐스팅 — 작은 값을 큰 배열 모양에 맞춰 늘린다</text><rect x="40" y="66" width="58" height="58" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="69.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">22.5</text><rect x="98" y="66" width="58" height="58" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="127.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">31.0</text><rect x="156" y="66" width="58" height="58" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="185.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">36.0</text><text x="234" y="100" font-size="22" font-weight="700" fill="#15171C" text-anchor="middle">+</text><rect x="256" y="66" width="58" height="58" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="285.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">1.5</text><rect x="314" y="66" width="58" height="58" fill="#FFF6D6" stroke="#9AA0A8" stroke-width="1.2"/><text x="343.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">1.5</text><rect x="372" y="66" width="58" height="58" fill="#FFF6D6" stroke="#9AA0A8" stroke-width="1.2"/><text x="401.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">1.5</text><text x="372" y="146" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">1.5 를 3칸으로 늘린 것처럼 계산</text><text x="450" y="100" font-size="22" font-weight="700" fill="#15171C" text-anchor="middle">=</text><rect x="474" y="66" width="58" height="58" fill="#E3F1F3" stroke="#15171C" stroke-width="1.2"/><text x="503.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">24.0</text><rect x="532" y="66" width="58" height="58" fill="#E3F1F3" stroke="#15171C" stroke-width="1.2"/><text x="561.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">32.5</text><rect x="590" y="66" width="58" height="58" fill="#E3F1F3" stroke="#15171C" stroke-width="1.2"/><text x="619.0" y="100.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">37.5</text><text x="561" y="146" font-size="12.5" font-weight="400" fill="#1F7A8C" text-anchor="middle">보정 후 온도</text><text x="380" y="178" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">실제로 복사본을 만들지는 않는다. 계산할 때만 모양을 맞춘다.</text></svg>