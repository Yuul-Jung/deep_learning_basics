<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="appA_target_map-t appA_target_map-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="appA_target_map-t">Target 지도</title><desc id="appA_target_map-d">회귀, 이진분류, 다중분류, 다중레이블의 정답 모양, 출력 수, Loss, 추론 방법, 평가 지표와 이 교재에서 다룬 장</desc><defs><marker id="ah-appA_target_map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/><text x="380" y="26" font-size="14.5" font-weight="600" fill="#15171C" text-anchor="middle">Target 지도 — 정답 모양 하나로 출력층·Loss·추론·Metric이 함께 정해진다</text><rect x="10" y="44" width="140" height="28" rx="3" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="80.0" y="63" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">정답 y</text><rect x="154" y="44" width="92" height="28" rx="3" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="200.0" y="63" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">문제 유형</text><rect x="250" y="44" width="70" height="28" rx="3" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="285.0" y="63" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">출력 (로짓)</text><rect x="324" y="44" width="150" height="28" rx="3" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="399.0" y="63" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">Loss</text><rect x="478" y="44" width="104" height="28" rx="3" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="530.0" y="63" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">추론</text><rect x="586" y="44" width="104" height="28" rx="3" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="638.0" y="63" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">Metric</text><rect x="694" y="44" width="58" height="28" rx="3" fill="#F5F5F2" stroke="#9AA0A8" stroke-width="1"/><text x="723.0" y="63" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">이 교재</text><rect x="10" y="80" width="140" height="44" rx="3" fill="#EDEAFA" stroke="#2457A6" stroke-width="1.4"/><text x="80.0" y="107" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">실수 [N, 1] float</text><rect x="154" y="80" width="92" height="44" rx="3" fill="#FFFFFF" stroke="#2457A6" stroke-width="1.4"/><text x="200.0" y="107" font-size="12" font-weight="700" fill="#2457A6" text-anchor="middle">회귀</text><rect x="250" y="80" width="70" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="285.0" y="107" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">1개</text><rect x="324" y="80" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#2457A6" stroke-width="1.4"/><text x="399.0" y="107" font-size="11.5" font-weight="700" fill="#2457A6" text-anchor="middle">MSELoss / L1Loss</text><rect x="478" y="80" width="104" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="530.0" y="107" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">그대로</text><rect x="586" y="80" width="104" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="638.0" y="107" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">MAE·RMSE·R²</text><rect x="694" y="80" width="58" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="723.0" y="107" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">2장</text><rect x="10" y="132" width="140" height="44" rx="3" fill="#EDEAFA" stroke="#B3261E" stroke-width="1.4"/><text x="80.0" y="159" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">0/1 [N, 1] float</text><rect x="154" y="132" width="92" height="44" rx="3" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.4"/><text x="200.0" y="159" font-size="12" font-weight="700" fill="#B3261E" text-anchor="middle">이진분류</text><rect x="250" y="132" width="70" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="285.0" y="159" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">1개</text><rect x="324" y="132" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.4"/><text x="399.0" y="159" font-size="11.5" font-weight="700" fill="#B3261E" text-anchor="middle">BCEWithLogitsLoss</text><rect x="478" y="132" width="104" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="530.0" y="159" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle">sigmoid ≥ 0.5</text><rect x="586" y="132" width="104" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="638.0" y="159" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">Acc·P·R·F1</text><rect x="694" y="132" width="58" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="723.0" y="159" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">3장</text><rect x="10" y="184" width="140" height="44" rx="3" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.4"/><text x="80.0" y="211" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">번호 [N] long</text><rect x="154" y="184" width="92" height="44" rx="3" fill="#FFFFFF" stroke="#4635B1" stroke-width="1.4"/><text x="200.0" y="211" font-size="12" font-weight="700" fill="#4635B1" text-anchor="middle">다중분류</text><rect x="250" y="184" width="70" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="285.0" y="211" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">C개</text><rect x="324" y="184" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#4635B1" stroke-width="1.4"/><text x="399.0" y="211" font-size="11.5" font-weight="700" fill="#4635B1" text-anchor="middle">CrossEntropyLoss</text><rect x="478" y="184" width="104" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="530.0" y="211" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">argmax</text><rect x="586" y="184" width="104" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="638.0" y="211" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">Acc·Macro F1</text><rect x="694" y="184" width="58" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="723.0" y="211" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">3–5장</text><rect x="10" y="236" width="140" height="44" rx="3" fill="#EDEAFA" stroke="#1F7A8C" stroke-width="1.4"/><text x="80.0" y="263" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">0/1 [N, C] float</text><rect x="154" y="236" width="92" height="44" rx="3" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="1.4"/><text x="200.0" y="263" font-size="12" font-weight="700" fill="#1F7A8C" text-anchor="middle">다중레이블</text><rect x="250" y="236" width="70" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="285.0" y="263" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">C개</text><rect x="324" y="236" width="150" height="44" rx="3" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="1.4"/><text x="399.0" y="263" font-size="11.5" font-weight="700" fill="#1F7A8C" text-anchor="middle">BCEWithLogitsLoss</text><rect x="478" y="236" width="104" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="530.0" y="263" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">칸마다 sigmoid</text><rect x="586" y="236" width="104" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="638.0" y="263" font-size="11.5" font-weight="500" fill="#15171C" text-anchor="middle">Micro·Macro F1</text><rect x="694" y="236" width="58" height="44" rx="3" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="723.0" y="263" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">부록</text><text x="380" y="300" font-size="12.5" font-weight="600" fill="#B3261E" text-anchor="middle">모델 구조(MLP·CNN)는 입력을 처리하는 방식일 뿐 — 같은 다중분류면 출력층과 Loss는 같다</text><text x="380" y="322" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">모델 끝은 로짓을 그대로 내보내고, Sigmoid·Softmax는 Loss 안에서(학습) 또는 추론 때만 쓴다</text></svg>