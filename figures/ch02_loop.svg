<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-labelledby="ch02_loop-t ch02_loop-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch02_loop-t">학습 반복</title><desc id="ch02_loop-d">순전파, 손실, 기울기 비우기, 역전파, 갱신의 다섯 단계를 epoch 수만큼 반복한다</desc><defs><marker id="ah-ch02_loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="220" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">학습 반복 한 바퀴 — 2장부터 5장까지 같은 다섯 줄</text><rect x="12" y="56" width="138" height="84" rx="8" fill="#FFFFFF" stroke="#4635B1" stroke-width="2"/><text x="81" y="84" font-size="13.5" font-weight="700" fill="#4635B1" text-anchor="middle">1. 순전파</text><text x="81" y="112" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">prediction =</text><text x="81" y="128" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">model(x)</text><line x1="152" y1="98" x2="160" y2="98" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_loop)"/><rect x="162" y="56" width="138" height="84" rx="8" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2"/><text x="231" y="84" font-size="13.5" font-weight="700" fill="#1F7A8C" text-anchor="middle">2. 손실</text><text x="231" y="112" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">loss = loss_function(</text><text x="231" y="128" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">prediction, y)</text><line x1="302" y1="98" x2="310" y2="98" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_loop)"/><rect x="312" y="56" width="138" height="84" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/><text x="381" y="84" font-size="13.5" font-weight="700" fill="#15171C" text-anchor="middle">3. 기울기 비우기</text><text x="381" y="112" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">optimizer.zero_grad()</text><line x1="452" y1="98" x2="460" y2="98" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_loop)"/><rect x="462" y="56" width="138" height="84" rx="8" fill="#FFFFFF" stroke="#B3261E" stroke-width="2"/><text x="531" y="84" font-size="13.5" font-weight="700" fill="#B3261E" text-anchor="middle">4. 역전파</text><text x="531" y="112" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">loss.backward()</text><line x1="602" y1="98" x2="610" y2="98" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_loop)"/><rect x="612" y="56" width="138" height="84" rx="8" fill="#FFFFFF" stroke="#1E6B34" stroke-width="2"/><text x="681" y="84" font-size="13.5" font-weight="700" fill="#1E6B34" text-anchor="middle">5. 갱신</text><text x="681" y="112" font-size="10.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">optimizer.step()</text><path d="M 681 142 C 681 196, 81 196, 81 142" fill="none" stroke="#15171C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-ch02_loop)"/><text x="380" y="210" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">epochs 번 반복 · 실습 2-1은 zero_grad 를 맨 앞에, 2-2부터는 역전파 바로 앞에 둔다 (결과는 같음)</text></svg>