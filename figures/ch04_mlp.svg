<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="ch04_mlp-t ch04_mlp-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch04_mlp-t">MLP 구조와 파라미터 수</title><desc id="ch04_mlp-d">입력, Flatten, Linear 784→128, ReLU, Dropout, Linear 128→10, 로짓의 순서와 학습 파라미터 101,770개, ReLU 그래프</desc><defs><marker id="ah-ch04_mlp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/><text x="380" y="26" font-size="14.5" font-weight="600" fill="#15171C" text-anchor="middle">실습 4-1의 MLP — 이미지를 784개 숫자로 펼친 뒤 두 번의 Linear로 로짓 10개를 만든다</text><rect x="14" y="50" width="96" height="70" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.8"/><text x="62.0" y="78" font-size="13" font-weight="700" fill="#15171C" text-anchor="middle">입력</text><text x="62.0" y="100" font-size="11" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 1, 28, 28]</text><line x1="111" y1="85" x2="121" y2="85" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_mlp)"/><rect x="122" y="50" width="96" height="70" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.8"/><text x="170.0" y="78" font-size="13" font-weight="700" fill="#15171C" text-anchor="middle">Flatten</text><text x="170.0" y="100" font-size="11" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 784]</text><text x="170.0" y="140" font-size="11.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">파라미터 없음</text><line x1="219" y1="85" x2="229" y2="85" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_mlp)"/><rect x="230" y="50" width="96" height="70" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.8"/><text x="278.0" y="78" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">Linear</text><text x="278.0" y="100" font-size="11" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">784 → 128</text><text x="278.0" y="140" font-size="11.5" font-weight="600" fill="#4635B1" text-anchor="middle">100,480개</text><line x1="327" y1="85" x2="337" y2="85" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_mlp)"/><rect x="338" y="50" width="96" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8"/><text x="386.0" y="78" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle">ReLU</text><text x="386.0" y="100" font-size="11" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 128]</text><text x="386.0" y="140" font-size="11.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">파라미터 없음</text><line x1="435" y1="85" x2="445" y2="85" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_mlp)"/><rect x="446" y="50" width="96" height="70" rx="8" fill="#FFF6D6" stroke="#C77700" stroke-width="1.8"/><text x="494.0" y="78" font-size="13" font-weight="700" fill="#C77700" text-anchor="middle">Dropout(0.2)</text><text x="494.0" y="100" font-size="11" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 128]</text><text x="494.0" y="140" font-size="11.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">파라미터 없음</text><line x1="543" y1="85" x2="553" y2="85" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_mlp)"/><rect x="554" y="50" width="96" height="70" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.8"/><text x="602.0" y="78" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">Linear</text><text x="602.0" y="100" font-size="11" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">128 → 10</text><text x="602.0" y="140" font-size="11.5" font-weight="600" fill="#4635B1" text-anchor="middle">1,290개</text><line x1="651" y1="85" x2="661" y2="85" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_mlp)"/><rect x="662" y="50" width="96" height="70" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.8"/><text x="710.0" y="78" font-size="13" font-weight="700" fill="#1F7A8C" text-anchor="middle">로짓</text><text x="710.0" y="100" font-size="11" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 10]</text><text x="380" y="170" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">학습 파라미터 = (784×128 + 128) + (128×10 + 10) = 100,480 + 1,290 = 101,770개</text><rect x="70" y="200" width="200" height="100" fill="#FBFBF9" stroke="#9AA0A8" stroke-width="1"/><line x1="103.3" y1="200" x2="103.3" y2="300" stroke="#E6E7E2" stroke-width="1"/><text x="103.33333333333333" y="316" font-size="11" font-weight="400" fill="#4A4F5A" text-anchor="middle">-2</text><line x1="170.0" y1="200" x2="170.0" y2="300" stroke="#E6E7E2" stroke-width="1"/><text x="170.0" y="316" font-size="11" font-weight="400" fill="#4A4F5A" text-anchor="middle">0</text><line x1="236.7" y1="200" x2="236.7" y2="300" stroke="#E6E7E2" stroke-width="1"/><text x="236.66666666666669" y="316" font-size="11" font-weight="400" fill="#4A4F5A" text-anchor="middle">2</text><line x1="70" y1="275.0" x2="270" y2="275.0" stroke="#E6E7E2" stroke-width="1"/><text x="64" y="279.0" font-size="11" font-weight="400" fill="#4A4F5A" text-anchor="end">0</text><line x1="70" y1="225.0" x2="270" y2="225.0" stroke="#E6E7E2" stroke-width="1"/><text x="64" y="229.0" font-size="11" font-weight="400" fill="#4A4F5A" text-anchor="end">2</text><polyline points="70.0,275.0 170.0,275.0 270.0,200.0" fill="none" stroke="#2E7D32" stroke-width="2.4"/><text x="170" y="196" font-size="12.5" font-weight="700" fill="#2E7D32" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">ReLU(x) = max(0, x)</text><text x="520" y="220" font-size="12.5" font-weight="700" fill="#B3261E" text-anchor="middle">ReLU가 없으면 Linear 두 개는 Linear 하나와 같다</text><text x="520" y="242" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">W₂(W₁x + b₁) + b₂ = (W₂W₁)x + (W₂b₁ + b₂)</text><text x="520" y="266" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">음수를 0으로 자르는 꺾임이 있어야 층을 쌓는 의미가 생긴다</text><text x="520" y="288" font-size="11.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">(추가 확인 01·02: XOR 문제와 두 층 합치기)</text></svg>