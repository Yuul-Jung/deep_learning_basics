<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="ch05_pad_stride-t ch05_pad_stride-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch05_pad_stride-t">패딩과 스트라이드에 따른 출력 크기</title><desc id="ch05_pad_stride-d">28×28 입력에 3×3 필터를 쓸 때 패딩 0·1과 스트라이드 1·2의 출력 크기 26, 28, 13, 14</desc><defs><marker id="ah-ch05_pad_stride" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="290" fill="#FFFFFF"/><text x="380" y="26" font-size="14.5" font-weight="600" fill="#15171C" text-anchor="middle">출력 크기 = ⌊(입력 − 필터 + 2 × 패딩) / 스트라이드⌋ + 1  (입력 28, 필터 3)</text><rect x="20" y="48" width="172" height="170" rx="8" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="106" y="70" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">padding=0, stride=1</text><rect x="38.0" y="84.0" width="84.0" height="84.0" fill="#F5F5F2" stroke="#15171C"/><text x="80.0" y="131.0" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">28</text><rect x="138" y="101.1" width="55.7" height="55.7" fill="#E3F1F3" stroke="#1F7A8C"/><text x="165.85714285714286" y="133" font-size="12" font-weight="700" fill="#1F7A8C" text-anchor="middle">26</text><text x="106" y="196" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">⌊(28−3+0)/1⌋+1 = 26</text><rect x="205" y="48" width="172" height="170" rx="8" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="291" y="70" font-size="12.5" font-weight="700" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">padding=1, stride=1</text><rect x="223" y="84" width="90.0" height="90.0" fill="#FFF6D6" stroke="#C77700"/><rect x="226.0" y="87.0" width="84.0" height="84.0" fill="#F5F5F2" stroke="#15171C"/><text x="268.0" y="134.0" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">28</text><rect x="323" y="99.0" width="60.0" height="60.0" fill="#E3F1F3" stroke="#1F7A8C"/><text x="353.0" y="133" font-size="12" font-weight="700" fill="#1F7A8C" text-anchor="middle">28</text><text x="291" y="196" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">⌊(28−3+2)/1⌋+1 = 28</text><rect x="390" y="48" width="172" height="170" rx="8" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="476" y="70" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">padding=0, stride=2</text><rect x="408.0" y="84.0" width="84.0" height="84.0" fill="#F5F5F2" stroke="#15171C"/><text x="450.0" y="131.0" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">28</text><rect x="508" y="115.1" width="27.9" height="27.9" fill="#E3F1F3" stroke="#1F7A8C"/><text x="521.9285714285714" y="133" font-size="12" font-weight="700" fill="#1F7A8C" text-anchor="middle">13</text><text x="476" y="196" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">⌊(28−3+0)/2⌋+1 = 13</text><rect x="575" y="48" width="172" height="170" rx="8" fill="#FFFFFF" stroke="#9AA0A8" stroke-width="1"/><text x="661" y="70" font-size="12.5" font-weight="700" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">padding=1, stride=2</text><rect x="593" y="84" width="90.0" height="90.0" fill="#FFF6D6" stroke="#C77700"/><rect x="596.0" y="87.0" width="84.0" height="84.0" fill="#F5F5F2" stroke="#15171C"/><text x="638.0" y="134.0" font-size="12" font-weight="700" fill="#15171C" text-anchor="middle">28</text><rect x="693" y="114.0" width="30.0" height="30.0" fill="#E3F1F3" stroke="#1F7A8C"/><text x="708.0" y="133" font-size="12" font-weight="700" fill="#1F7A8C" text-anchor="middle">14</text><text x="661" y="196" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">⌊(28−3+2)/2⌋+1 = 14</text><text x="380" y="244" font-size="12.5" font-weight="500" fill="#C77700" text-anchor="middle">패딩: 가장자리에 0을 둘러 크기가 줄지 않게(정보 손실도 줄임) — padding=1이면 28 → 28</text><text x="380" y="268" font-size="12.5" font-weight="500" fill="#4635B1" text-anchor="middle">스트라이드: 필터가 한 번에 움직이는 칸 수 — 2이면 크기가 약 절반</text></svg>