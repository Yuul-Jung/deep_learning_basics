<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="ch01_autograd-t ch01_autograd-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch01_autograd-t">자동 미분</title><desc id="ch01_autograd-d">x=3 에서 y=x²+2x=15 를 계산하고 backward 로 dy/dx=2x+2=8 을 얻는 과정</desc><defs><marker id="ah-ch01_autograd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="250" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">자동 미분 — 계산 과정을 기록했다가 거꾸로 따라가며 기울기를 구한다</text><rect x="40" y="92" width="120" height="56" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2"/><text x="100" y="116" font-size="14" font-weight="700" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">x = 3.0</text><text x="100" y="136" font-size="11.5" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">requires_grad</text><rect x="250" y="60" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="1.5"/><text x="310" y="87" font-size="13.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">x²  = 9</text><rect x="250" y="136" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="1.5"/><text x="310" y="163" font-size="13.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">2x  = 6</text><rect x="460" y="92" width="120" height="56" rx="8" fill="#FFF6D6" stroke="#15171C" stroke-width="2"/><text x="520" y="125" font-size="14" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">y = 15</text><line x1="162" y1="112" x2="248" y2="84" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch01_autograd)"/><line x1="162" y1="128" x2="248" y2="156" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch01_autograd)"/><line x1="372" y1="82" x2="458" y2="110" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch01_autograd)"/><line x1="372" y1="158" x2="458" y2="132" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch01_autograd)"/><text x="310" y="210" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">앞으로 계산 (순전파): 값을 구하며 과정을 기록</text><rect x="610" y="92" width="130" height="56" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2"/><text x="675" y="116" font-size="14" font-weight="700" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">x.grad = 8</text><text x="675" y="136" font-size="11.5" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">dy/dx = 2x + 2</text><line x1="582" y1="120" x2="608" y2="120" stroke="#4635B1" stroke-width="1.6" marker-end="url(#ah-ch01_autograd)"/><text x="675" y="172" font-size="12.5" font-weight="600" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">y.backward():</text><text x="675" y="192" font-size="12.5" font-weight="400" fill="#4635B1" text-anchor="middle">기록을 거꾸로 따라</text><text x="675" y="210" font-size="12.5" font-weight="400" fill="#4635B1" text-anchor="middle">기울기 계산</text><text x="380" y="238" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">2장에서는 x 대신 가중치 W, y 대신 손실(cost)을 놓고 같은 일을 한다</text></svg>