or="middle">강의에 없는 심화</text><line x1="396" y1="355" x2="420" y2="355" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_overview)"/><rect x="424" y="340" width="322" height="30" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="585" y="360" font-size="12" font-weight="500" fill="#15171C" text-anchor="middle">실습 4-2 Optimizer · 4-3 Dropout · 4-4 오답 · 4-6 예측</text></svg>