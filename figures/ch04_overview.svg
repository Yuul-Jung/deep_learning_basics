<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="ch04_overview-t ch04_overview-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch04_overview-t">4장 큰 그림</title><desc id="ch04_overview-d">데이터 분리부터 분석까지 일곱 단계의 흐름과 강의 세 부분과 실습 여섯 개의 대응을 보여 준다</desc><defs><marker id="ah-ch04_overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/><text x="380" y="28" font-size="15" font-weight="600" fill="#15171C" text-anchor="middle">4장의 흐름 — 은닉층을 쌓고, 큰 데이터를 배치로 나눠 학습·검증·평가한다</text><rect x="12" y="52" width="98" height="62" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.6"/><text x="61.0" y="78" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">데이터 분리</text><text x="61.0" y="98" font-size="10" font-weight="400" fill="#4A4F5A" text-anchor="middle">train·val·test</text><line x1="111" y1="83" x2="119" y2="83" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_overview)"/><rect x="120" y="52" width="98" height="62" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.6"/><text x="169.0" y="78" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">DataLoader</text><text x="169.0" y="98" font-size="10" font-weight="400" fill="#4A4F5A" text-anchor="middle">배치 64·shuffle</text><line x1="219" y1="83" x2="227" y2="83" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_overview)"/><rect x="228" y="52" width="98" height="62" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.6"/><text x="277.0" y="78" font-size="12.5" font-weight="700" fill="#4635B1" text-anchor="middle">MLP</text><text x="277.0" y="98" font-size="10" font-weight="400" fill="#4A4F5A" text-anchor="middle">Linear + ReLU</text><line x1="327" y1="83" x2="335" y2="83" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_overview)"/><rect x="336" y="52" width="98" height="62" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.6"/><text x="385.0" y="78" font-size="12.5" font-weight="700" fill="#4635B1" text-anchor="middle">CrossEntropy</text><text x="385.0" y="98" font-size="10" font-weight="400" fill="#4A4F5A" text-anchor="middle">+ Adam</text><line x1="435" y1="83" x2="443" y2="83" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_overview)"/><rect x="444" y="52" width="98" height="62" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.6"/><text x="493.0" y="78" font-size="12.5" font-weight="700" fill="#1F7A8C" text-anchor="middle">학습 · 검증</text><text x="493.0" y="98" font-size="10" font-weight="400" fill="#4A4F5A" text-anchor="middle">매 Epoch 기록</text><line x1="543" y1="83" x2="551" y2="83" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_overview)"/><rect x="552" y="52" width="98" height="62" rx="8" fill="#FFF6D6" stroke="#15171C" stroke-width="1.6"/><text x="601.0" y="78" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">테스트</text><text x="601.0" y="98" font-size="10" font-weight="400" fill="#4A4F5A" text-anchor="middle">마지막에 한 번</text><line x1="651" y1="83" x2="659" y2="83" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch04_overview)"/><rect x="660" y="52" width="98" height="62" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="1.6"/><text x="709.0" y="78" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">분석 · 예측</text><text x="709.0" y="98" font-size="10" font-weight="400" fill="#4A4F5A" text-anchor="middle">혼동행렬 · 오답</text><text x="380" y="150" font-size="12.5" font-weight="500" fill="#2E7D32" text-anchor="middle">3장과 같은 것: 로짓 → CrossEntropyLoss, 학습 반복 다섯 줄, argmax로 답 고르기</text><text x="380" y="172" font-size="12.5" font-weight="500" fill="#B3261E" text-anchor="middle">새로 생긴 것: 은닉층·ReLU, 배치·Epoch, 검증 데이터, Optimizer 비교, 과적합과 Dropout, 오답 분석</text><text x=