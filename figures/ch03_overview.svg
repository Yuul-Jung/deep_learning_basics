<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="ch03_overview-t ch03_overview-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch03_overview-t">3장 큰 그림</title><desc id="ch03_overview-d">회귀, 이진분류, 다중분류의 가설·출력 변환·손실·답을 나란히 비교하고 강의 두 부분과 실습 네 개의 대응을 보여 준다</desc><defs><marker id="ah-ch03_overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">3장의 흐름 — 2장의 직선 뒤에 &quot;확률로 바꾸는 함수&quot;를 붙인다</text><rect x="30" y="50" width="225" height="172" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/><text x="142" y="76" font-size="15" font-weight="700" fill="#15171C" text-anchor="middle">회귀 (2장)</text><text x="46" y="102" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">가설</text><text x="240" y="102" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end" font-family="IBM Plex Mono, Consolas, monospace">z = XW + b</text><line x1="42" y1="113" x2="243" y2="113" stroke="#E6E7E2"/><text x="46" y="132" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">출력 변환</text><text x="240" y="132" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end" font-family="IBM Plex Mono, Consolas, monospace">그대로 출력</text><line x1="42" y1="143" x2="243" y2="143" stroke="#E6E7E2"/><text x="46" y="162" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">손실</text><text x="240" y="162" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end">MSE</text><line x1="42" y1="173" x2="243" y2="173" stroke="#E6E7E2"/><text x="46" y="192" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">답</text><text x="240" y="192" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end">숫자 하나</text><line x1="257" y1="136" x2="273" y2="136" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_overview)"/><rect x="275" y="50" width="225" height="172" rx="8" fill="#FFFFFF" stroke="#4635B1" stroke-width="2"/><text x="387" y="76" font-size="15" font-weight="700" fill="#4635B1" text-anchor="middle">이진분류</text><text x="291" y="102" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">가설</text><text x="485" y="102" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end" font-family="IBM Plex Mono, Consolas, monospace">z = XW + b</text><line x1="287" y1="113" x2="488" y2="113" stroke="#E6E7E2"/><text x="291" y="132" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">출력 변환</text><text x="485" y="132" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end" font-family="IBM Plex Mono, Consolas, monospace">sigmoid(z)</text><line x1="287" y1="143" x2="488" y2="143" stroke="#E6E7E2"/><text x="291" y="162" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">손실</text><text x="485" y="162" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end">BCE</text><line x1="287" y1="173" x2="488" y2="173" stroke="#E6E7E2"/><text x="291" y="192" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">답</text><text x="485" y="192" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end">0 또는 1</text><line x1="502" y1="136" x2="518" y2="136" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_overview)"/><rect x="520" y="50" width="225" height="172" rx="8" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2"/><text x="632" y="76" font-size="15" font-weight="700" fill="#1F7A8C" text-anchor="middle">다중분류</text><text x="536" y="102" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">가설</text><text x="730" y="102" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end" font-family="IBM Plex Mono, Consolas, monospace">Z = XWᵀ + b</text><line x1="532" y1="113" x2="733" y2="113" stroke="#E6E7E2"/><text x="536" y="132" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">출력 변환</text><text x="730" y="132" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end" font-family="IBM Plex Mono, Consolas, monospace">softmax(Z)</text><line x1="532" y1="143" x2="733" y2="143" stroke="#E6E7E2"/><text x="536" y="162" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">손실</text><text x="730" y="162" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end">교차엔트로피</text><line x1="532" y1="173" x2="733" y2="173" stroke="#E6E7E2"/><text x="536" y="192" font-size="12" font-weight="500" fill="#4A4F5A" text-anchor="start">답</text><text x="730" y="192" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="end">K개 중 하나</text><text x="380" y="248" font-size="12.5" font-weight="500" fill="#B3261E" text-anchor="middle">학습 반복 다섯 줄(순전파 → 손실 → zero_grad → backward → step)은 그대로</text><text x="380" y="280" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle">강의와 실습의 대응</text><rect x="20" y="296" width="360" height="28" rx="5" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="200" y="315" font-size="12.5" font-weight="600" fill="#4635B1" text-anchor="middle">강의 3-1 이진분류 · 로지스틱 가설 · 새 손실함수</text><line x1="382" y1="310" x2="418" y2="310" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_overview)"/><rect x="422" y="296" width="318" height="28" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="581" y="315" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">실습 3-1 로지스틱 분류 · 3-2 심장질환</text><rect x="20" y="332" width="360" height="28" rx="5" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="200" y="351" font-size="12.5" font-weight="600" fill="#4635B1" text-anchor="middle">강의 3-2 다중분류 · 소프트맥스 · 교차엔트로피</text><line x1="382" y1="346" x2="418" y2="346" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_overview)"/><rect x="422" y="332" width="318" height="28" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="581" y="351" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">실습 3-3 Softmax 다중분류 · 3-4 Iris</text></svg>