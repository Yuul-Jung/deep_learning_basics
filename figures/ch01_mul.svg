<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="ch01_mul-t ch01_mul-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch01_mul-t">원소별 곱셈과 행렬곱</title><desc id="ch01_mul-d">[[1,2],[3,4]] 과 [[5,6],[7,8]] 의 원소별 곱은 [[5,12],[21,32]], 행렬곱은 [[19,22],[43,50]]</desc><defs><marker id="ah-ch01_mul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="290" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">* 는 같은 자리끼리, @ 는 행 × 열</text><text x="190" y="62" font-size="14" font-weight="700" fill="#1F7A8C" text-anchor="middle">원소별 곱셈  a * b</text><rect x="40" y="84" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="57.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">1</text><rect x="74" y="84" width="34" height="34" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="91.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">2</text><rect x="40" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="57.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">3</text><rect x="74" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="91.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">4</text><text x="126" y="124" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">*</text><rect x="146" y="84" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="163.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">5</text><rect x="180" y="84" width="34" height="34" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="197.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">6</text><rect x="146" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="163.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">7</text><rect x="180" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="197.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">8</text><text x="232" y="124" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">=</text><rect x="252" y="84" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="269.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">5</text><rect x="286" y="84" width="34" height="34" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="303.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">12</text><rect x="252" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="269.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">21</text><rect x="286" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="303.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">32</text><text x="190" y="186" font-size="13" font-weight="400" fill="#15171C" text-anchor="middle">노란 칸: 2 × 6 = 12</text><text x="190" y="208" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">모양이 같은 두 배열의 같은 위치끼리 곱함</text><text x="570" y="62" font-size="14" font-weight="700" fill="#4635B1" text-anchor="middle">행렬곱  a @ b</text><rect x="420" y="84" width="34" height="34" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="437.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">1</text><rect x="454" y="84" width="34" height="34" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="471.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">2</text><rect x="420" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="437.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">3</text><rect x="454" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="471.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">4</text><text x="506" y="124" font-size="18" font-weight="700" fill="#15171C" text-anchor="middle">@</text><rect x="526" y="84" width="34" height="34" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="543.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">5</text><rect x="560" y="84" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="577.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">6</text><rect x="526" y="118" width="34" height="34" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="543.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">7</text><rect x="560" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="577.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">8</text><text x="612" y="124" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">=</text><rect x="632" y="84" width="34" height="34" fill="#FFD24A" stroke="#15171C" stroke-width="1.2"/><text x="649.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">19</text><rect x="666" y="84" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="683.0" y="106.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">22</text><rect x="632" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="649.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">43</text><rect x="666" y="118" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="683.0" y="140.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">50</text><text x="570" y="186" font-size="13" font-weight="400" fill="#15171C" text-anchor="middle">노란 칸: 1×5 + 2×7 = 19</text><text x="570" y="208" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">앞 행렬의 행과 뒤 행렬의 열을 곱해 더함</text><line x1="380" y1="52" x2="380" y2="220" stroke="#9AA0A8" stroke-width="1"/><rect x="120" y="236" width="520" height="40" rx="8" fill="#FBFBF9" stroke="#9AA0A8" stroke-width="1"/><text x="380" y="261" font-size="13" font-weight="500" fill="#15171C" text-anchor="middle">신경망의 한 층 = 입력 X @ 가중치 W + 편향 b  → 2장부터 계속 쓰는 계산</text></svg>