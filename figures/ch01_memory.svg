<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="ch01_memory-t ch01_memory-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch01_memory-t">메모리 공유와 복사</title><desc id="ch01_memory-d">from_numpy 와 numpy() 는 같은 메모리를 가리켜 한쪽 변경이 다른 쪽에 보이고, torch.tensor·clone·copy 는 새 메모리를 만든다</desc><defs><marker id="ah-ch01_memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="280" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">변환할 때 메모리를 함께 쓰는가, 복사하는가</text><rect x="24" y="50" width="348" height="210" rx="8" fill="#FBFBF9" stroke="#9AA0A8" stroke-width="1"/><text x="198" y="76" font-size="13.5" font-weight="700" fill="#B3261E" text-anchor="middle">메모리를 함께 씀 (한쪽을 바꾸면 둘 다 바뀜)</text><rect x="48" y="96" width="120" height="48" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.5"/><text x="108" y="125" font-size="13" font-weight="600" fill="#1F7A8C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">numpy_data</text><rect x="228" y="96" width="120" height="48" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.5"/><text x="288" y="125" font-size="13" font-weight="600" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">shared_tensor</text><rect x="118" y="182" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="1.5"/><text x="198" y="209" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[[10, 20], [30, 40]]</text><line x1="108" y1="146" x2="168" y2="180" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch01_memory)"/><line x1="288" y1="146" x2="228" y2="180" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch01_memory)"/><text x="198" y="246" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">torch.from_numpy(arr) · tensor.numpy()</text><rect x="388" y="50" width="348" height="210" rx="8" fill="#FBFBF9" stroke="#9AA0A8" stroke-width="1"/><text x="562" y="76" font-size="13.5" font-weight="700" fill="#1E6B34" text-anchor="middle">새로 복사함 (서로 독립)</text><rect x="412" y="96" width="120" height="48" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.5"/><text x="472" y="125" font-size="13" font-weight="600" fill="#1F7A8C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">np_data</text><rect x="592" y="96" width="120" height="48" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.5"/><text x="652" y="125" font-size="13" font-weight="600" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">tensor_data</text><rect x="412" y="182" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="1.5"/><text x="472" y="209" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">값 묶음 ①</text><rect x="592" y="182" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="1.5"/><text x="652" y="209" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">값 묶음 ②</text><line x1="472" y1="146" x2="472" y2="180" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch01_memory)"/><line x1="652" y1="146" x2="652" y2="180" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch01_memory)"/><text x="562" y="246" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">torch.tensor(arr) · .clone() · .copy()</text></svg>