<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="ch02_split_scale-t ch02_split_scale-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch02_split_scale-t">데이터 분리와 표준화</title><desc id="ch02_split_scale-d">데이터를 섞어 훈련과 테스트로 나누고, 훈련 데이터의 평균과 표준편차로 두 쪽을 모두 표준화한다</desc><defs><marker id="ah-ch02_split_scale" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="250" fill="#FFFFFF"/><text x="380" y="28" font-size="15" font-weight="600" fill="#15171C" text-anchor="middle">평균·표준편차는 훈련 데이터에서만 구하고, 테스트에는 그 값을 그대로 쓴다</text><rect x="20" y="60" width="180" height="120" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.5"/><text x="110" y="110" font-size="14" font-weight="700" fill="#15171C" text-anchor="middle">전체 데이터</text><text x="110" y="134" font-size="12" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">섞기 randperm</text><line x1="202" y1="96" x2="258" y2="80" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_split_scale)"/><line x1="202" y1="144" x2="258" y2="164" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_split_scale)"/><rect x="260" y="52" width="170" height="60" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1.5"/><text x="345" y="78" font-size="13.5" font-weight="700" fill="#1F7A8C" text-anchor="middle">훈련 데이터</text><text x="345" y="98" font-size="12" font-weight="400" fill="#15171C" text-anchor="middle">75~80 %</text><rect x="260" y="136" width="170" height="60" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="1.5"/><text x="345" y="162" font-size="13.5" font-weight="700" fill="#4635B1" text-anchor="middle">테스트 데이터</text><text x="345" y="182" font-size="12" font-weight="400" fill="#15171C" text-anchor="middle">20~25 %</text><line x1="432" y1="82" x2="488" y2="82" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_split_scale)"/><rect x="490" y="52" width="250" height="60" rx="8" fill="#FFF6D6" stroke="#15171C" stroke-width="1.5"/><text x="615" y="78" font-size="13" font-weight="700" fill="#15171C" text-anchor="middle">μ, σ 계산 → 표준화 → 학습</text><text x="615" y="98" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">(x − μ) / σ</text><line x1="432" y1="166" x2="488" y2="166" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_split_scale)"/><rect x="490" y="136" width="250" height="60" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="1.5"/><text x="615" y="162" font-size="13" font-weight="700" fill="#15171C" text-anchor="middle">같은 μ, σ 로 표준화 → 평가만</text><text x="615" y="182" font-size="12" font-weight="400" fill="#15171C" text-anchor="middle">학습·통계 계산에 쓰지 않음</text><line x1="615" y1="114" x2="615" y2="134" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_split_scale)"/><text x="380" y="228" font-size="12.5" font-weight="500" fill="#B3261E" text-anchor="middle">테스트로 μ, σ 를 다시 구하면 평가 정보가 학습에 새어 들어간다 (데이터 누출, Data Leakage)</text></svg>