<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="ch02_overview-t ch02_overview-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch02_overview-t">2장 큰 그림</title><desc id="ch02_overview-d">가설, 손실, 경사하강법, 여러 입력의 네 단계와 강의 세 부분이 실습 2-1부터 2-6까지 어떻게 대응하는지 보여 준다</desc><defs><marker id="ah-ch02_overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/><text x="380" y="28" font-size="16" font-weight="600" fill="#15171C" text-anchor="middle">2장의 흐름 — 직선 하나를 데이터에 맞추는 세 단계</text><rect x="16" y="52" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#4635B1" stroke-width="2"/><text x="101" y="78" font-size="15" font-weight="700" fill="#4635B1" text-anchor="middle">가설</text><text x="101" y="104" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">H(x) = Wx + b</text><text x="101" y="128" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">직선으로 예측</text><line x1="188" y1="98" x2="200" y2="98" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_overview)"/><rect x="202" y="52" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="2"/><text x="287" y="78" font-size="15" font-weight="700" fill="#1F7A8C" text-anchor="middle">손실</text><text x="287" y="104" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">cost(W, b) = MSE</text><text x="287" y="128" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">틀린 정도를 숫자로</text><line x1="374" y1="98" x2="386" y2="98" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_overview)"/><rect x="388" y="52" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#B3261E" stroke-width="2"/><text x="473" y="78" font-size="15" font-weight="700" fill="#B3261E" text-anchor="middle">경사하강법</text><text x="473" y="104" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">W := W − α·∂cost/∂W</text><text x="473" y="128" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">손실이 줄어드는 쪽으로</text><line x1="560" y1="98" x2="572" y2="98" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_overview)"/><rect x="574" y="52" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#15171C" stroke-width="2"/><text x="659" y="78" font-size="15" font-weight="700" fill="#15171C" text-anchor="middle">여러 입력</text><text x="659" y="104" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">H(X) = XW + b</text><text x="659" y="128" font-size="12.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">행렬곱 한 번에</text><path d="M 473 146 C 473 178, 287 178, 287 146" fill="none" stroke="#B3261E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-ch02_overview)"/><text x="380" y="190" font-size="12.5" font-weight="500" fill="#B3261E" text-anchor="middle">손실이 충분히 작아질 때까지 반복 (epoch)</text><text x="380" y="226" font-size="13.5" font-weight="600" fill="#15171C" text-anchor="middle">강의와 실습의 대응</text><rect x="40" y="246" width="300" height="28" rx="5" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="190" y="265" font-size="12.5" font-weight="600" fill="#4635B1" text-anchor="middle">강의 2-1 가설과 손실함수</text><line x1="342" y1="260" x2="386" y2="260" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_overview)"/><rect x="390" y="246" width="330" height="28" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="555" y="265" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">실습 2-1 순전파와 손실 · 2-2 nn.Linear</text><rect x="40" y="282" width="300" height="28" rx="5" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="190" y="301" font-size="12.5" font-weight="600" fill="#4635B1" text-anchor="middle">강의 2-2 손실 최소화 알고리즘</text><line x1="342" y1="296" x2="386" y2="296" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_overview)"/><rect x="390" y="282" width="330" height="28" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="555" y="301" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">실습 2-3 비용 최소화 · 2-4 실제 데이터(물고기)</text><rect x="40" y="318" width="300" height="28" rx="5" fill="#EDEAFA" stroke="#4635B1" stroke-width="1"/><text x="190" y="337" font-size="12.5" font-weight="600" fill="#4635B1" text-anchor="middle">강의 2-3 여러 입력의 선형회귀</text><line x1="342" y1="332" x2="386" y2="332" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch02_overview)"/><rect x="390" y="318" width="330" height="28" rx="5" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="1"/><text x="555" y="337" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">실습 2-5 다중 선형회귀 · 2-6 주택가격</text></svg>