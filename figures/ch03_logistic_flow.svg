<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="ch03_logistic_flow-t ch03_logistic_flow-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch03_logistic_flow-t">로지스틱 분류의 학습과 예측 경로</title><desc id="ch03_logistic_flow-d">선형 계층이 로짓 z를 내고, 학습에서는 z를 BCEWithLogitsLoss에 바로 넣으며, 예측에서는 sigmoid로 확률을 만든 뒤 0.5와 비교한다</desc><defs><marker id="ah-ch03_logistic_flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="270" fill="#FFFFFF"/><text x="380" y="26" font-size="15" font-weight="600" fill="#15171C" text-anchor="middle">모델은 로짓까지만 — 학습과 예측에서 시그모이드를 쓰는 곳이 다르다</text><rect x="20" y="70" width="110" height="56" rx="8" fill="#F5F5F2" stroke="#15171C" stroke-width="1.5"/><text x="75" y="94" font-size="14" font-weight="700" fill="#15171C" text-anchor="middle">입력 X</text><text x="75" y="113" font-size="11.5" font-weight="400" fill="#4A4F5A" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">[N, 특성 수]</text><line x1="132" y1="98" x2="168" y2="98" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_logistic_flow)"/><rect x="170" y="70" width="150" height="56" rx="8" fill="#EDEAFA" stroke="#4635B1" stroke-width="2"/><text x="245" y="94" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">nn.Linear(n, 1)</text><text x="245" y="113" font-size="12" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">z = XWᵀ + b</text><line x1="322" y1="98" x2="340" y2="98" stroke="#15171C" stroke-width="1.6"/><line x1="340" y1="98" x2="368" y2="72" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_logistic_flow)"/><line x1="340" y1="98" x2="368" y2="132" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_logistic_flow)"/><text x="330" y="90" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">z</text><rect x="370" y="46" width="200" height="48" rx="8" fill="#FFF6D6" stroke="#15171C" stroke-width="1.5"/><text x="470" y="67" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle">학습: BCEWithLogitsLoss(z, y)</text><text x="470" y="85" font-size="11.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">시그모이드 + BCE를 한 번에</text><line x1="572" y1="70" x2="610" y2="70" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_logistic_flow)"/><text x="680" y="74" font-size="12.5" font-weight="600" fill="#B3261E" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">backward → step</text><rect x="370" y="110" width="200" height="48" rx="8" fill="#E3F1F3" stroke="#1F7A8C" stroke-width="2"/><text x="470" y="131" font-size="12.5" font-weight="700" fill="#1F7A8C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">예측: torch.sigmoid(z)</text><text x="470" y="149" font-size="11.5" font-weight="400" fill="#4A4F5A" text-anchor="middle">확률 p (0 ~ 1)</text><line x1="572" y1="134" x2="610" y2="134" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch03_logistic_flow)"/><rect x="612" y="110" width="130" height="48" rx="8" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="1.5"/><text x="677" y="131" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">p ≥ 0.5 → 1</text><text x="677" y="149" font-size="12.5" font-weight="700" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">p &lt; 0.5 → 0</text><text x="380" y="196" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="middle">로짓(logit): 확률로 바꾸기 전의 점수, 범위 −∞ ~ +∞. 로짓 0 ⇔ 확률 0.5</text><text x="380" y="220" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">모델 안에 nn.Sigmoid()를 넣고 BCELoss를 써도 같은 계산이지만, 로짓이 극단이면 손실이 100에서 잘린다(추가 확인 03)</text><text x="380" y="244" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">다중분류도 같다: 학습은 CrossEntropyLoss(Z, y), 확률은 torch.softmax(Z, dim=1), 답은 argmax</text></svg>