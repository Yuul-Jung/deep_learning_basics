<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="ch04_split-t ch04_split-d" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch04_split-t">훈련·검증·테스트 데이터</title><desc id="ch04_split-d">55,000개 훈련, 5,000개 검증, 10,000개 테스트의 비율과 각 데이터의 역할, 쓰는 시점</desc><defs><marker id="ah-ch04_split" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171C"/></marker></defs><rect x="0" y="0" width="760" height="260" fill="#FFFFFF"/><text x="380" y="26" font-size="15" font-weight="600" fill="#15171C" text-anchor="middle">MNIST 70,000장의 세 갈래 — 각자 맡은 일이 다르다</text><rect x="30.0" y="50" width="550.0" height="44" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.6"/><text x="305.0" y="70" font-size="13" font-weight="700" fill="#2E7D32" text-anchor="middle">train</text><text x="305.0" y="87" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">55,000</text><rect x="580.0" y="50" width="50.0" height="44" fill="#E1D5F5" stroke="#4635B1" stroke-width="1.6"/><text x="605.0" y="70" font-size="13" font-weight="700" fill="#4635B1" text-anchor="middle">val</text><text x="605.0" y="87" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">5,000</text><rect x="630.0" y="50" width="100.0" height="44" fill="#FFE0B2" stroke="#C77700" stroke-width="1.6"/><text x="680.0" y="70" font-size="13" font-weight="700" fill="#C77700" text-anchor="middle">test</text><text x="680.0" y="87" font-size="12" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">10,000</text><text x="330.0" y="112" font-size="11.5" font-weight="500" fill="#4A4F5A" text-anchor="middle">원래 훈련 60,000 → 55,000 + 5,000 (random_split, seed 42)</text><text x="680.0" y="112" font-size="11.5" font-weight="500" fill="#4A4F5A" text-anchor="middle">원래 테스트 10,000</text><rect x="30" y="132" width="120" height="26" rx="4" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1"/><text x="90" y="150" font-size="12.5" font-weight="700" fill="#2E7D32" text-anchor="middle">train</text><text x="166" y="150" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start">가중치·편향을 학습</text><text x="730" y="150" font-size="12" font-weight="600" fill="#2E7D32" text-anchor="end">학습 중 매 배치</text><rect x="30" y="166" width="120" height="26" rx="4" fill="#E1D5F5" stroke="#4635B1" stroke-width="1"/><text x="90" y="184" font-size="12.5" font-weight="700" fill="#4635B1" text-anchor="middle">validation</text><text x="166" y="184" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start">매 Epoch 상태 확인 · 모델/설정 고르기</text><text x="730" y="184" font-size="12" font-weight="600" fill="#4635B1" text-anchor="end">학습 중 매 Epoch</text><rect x="30" y="200" width="120" height="26" rx="4" fill="#FFE0B2" stroke="#C77700" stroke-width="1"/><text x="90" y="218" font-size="12.5" font-weight="700" fill="#C77700" text-anchor="middle">test</text><text x="166" y="218" font-size="12.5" font-weight="500" fill="#15171C" text-anchor="start">최종 성능 한 번 측정</text><text x="730" y="218" font-size="12" font-weight="600" fill="#C77700" text-anchor="end">모든 선택이 끝난 뒤</text><text x="380" y="246" font-size="12.5" font-weight="500" fill="#B3261E" text-anchor="middle">테스트 결과를 보고 학습률·구조를 다시 고르면 테스트가 또 하나의 검증 데이터가 되어 버린다</text></svg>