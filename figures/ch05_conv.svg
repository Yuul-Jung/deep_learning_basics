4" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="375.0" y="156.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">6</text><rect x="392" y="134" width="34" height="34" fill="#FFFFFF" stroke="#15171C" stroke-width="1.2"/><text x="409.0" y="156.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">15</text><text x="450" y="140" font-size="16" font-weight="700" fill="#2457A6" text-anchor="middle">+ 3</text><text x="528" y="56" font-size="12.5" font-weight="700" fill="#1F7A8C" text-anchor="middle">특징 맵</text><rect x="494" y="100" width="34" height="34" fill="#E3F1F3" stroke="#15171C" stroke-width="1.2"/><text x="511.0" y="122.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">18</text><rect x="528" y="100" width="34" height="34" fill="#E3F1F3" stroke="#15171C" stroke-width="1.2"/><text x="545.0" y="122.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">19</text><rect x="494" y="134" width="34" height="34" fill="#E3F1F3" stroke="#15171C" stroke-width="1.2"/><text x="511.0" y="156.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">9</text><rect x="528" y="134" width="34" height="34" fill="#E3F1F3" stroke="#15171C" stroke-width="1.2"/><text x="545.0" y="156.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">18</text><line x1="566" y1="134" x2="600" y2="134" stroke="#15171C" stroke-width="1.6" marker-end="url(#ah-ch05_conv)"/><text x="583" y="124" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="middle">ReLU</text><text x="636" y="56" font-size="12.5" font-weight="700" fill="#C77700" text-anchor="middle">Max Pool 2×2</text><rect x="620" y="117" width="34" height="34" fill="#FFF6D6" stroke="#15171C" stroke-width="1.2"/><text x="637.0" y="139.0" font-size="14" font-weight="400" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">19</text><text x="380" y="234" font-size="12.5" font-weight="600" fill="#15171C" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace">왼쪽 위 칸: 1·2 + 2·0 + 3·1 + 0·0 + 1·1 + 2·2 + 3·1 + 0·0 + 1·2 = 15</text><text x="380" y="258" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">필터가 오른쪽·아래로 한 칸씩(stride 1) 움직여 2×2 결과를 채우고, 바이어스 3을 모든 칸에 더한다</text><text x="380" y="280" font-size="12" font-weight="400" fill="#4A4F5A" text-anchor="middle">ReLU는 음수만 0으로 바꾸므로 이 예에서는 값이 그대로이고, Max Pooling은 가장 큰 값 하나를 남긴다</text></svg>